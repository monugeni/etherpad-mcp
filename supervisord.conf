[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:etherpad]
command=/usr/local/bin/docker-entrypoint.sh pnpm run prod
directory=/opt/etherpad-lite
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:mcp]
command=node /opt/mcp/dist/index.js
directory=/opt/mcp
environment=ETHERPAD_URL="http://localhost:9001",ETHERPAD_PUBLIC_URL="%(ENV_ETHERPAD_PUBLIC_URL)s",ETHERPAD_API_KEY_FILE="/opt/etherpad-lite/APIKEY.txt",MCP_API_KEY="%(ENV_MCP_API_KEY)s",AUTHOR_NAME="%(ENV_AUTHOR_NAME)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=3
startretries=10
