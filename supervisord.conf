[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:etherpad]
command=node /opt/etherpad-lite/node_modules/ep_etherpad-lite/node/server.js
directory=/opt/etherpad-lite
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:mcp]
command=node /opt/mcp/dist/index.js
directory=/opt/mcp
environment=ETHERPAD_URL="http://localhost:9001",ETHERPAD_API_KEY="%(ENV_API_KEY)s",MCP_API_KEY="%(ENV_MCP_API_KEY)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
